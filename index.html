<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人导航页</title>
    <style>
        :root {
            --glass-bg: rgba(20, 20, 35, 0.45);
            --glass-bg-hover: rgba(30, 30, 50, 0.6);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-primary: rgba(255, 255, 255, 0.92);
            --text-secondary: rgba(255, 255, 255, 0.65);
            --accent: rgba(100, 180, 255, 0.7);
            --accent-hover: rgba(120, 200, 255, 0.85);
            --radius: 16px;
            --blur: 12px;
            --transition: 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-image: url('image.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #1a1a2e;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            position: relative;
            padding-top: 6vh;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 28px;
            width: 100%;
            max-width: 680px;
            padding: 20px;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 时间区域 */
        .time-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            background: transparent;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            opacity: 0.88;
        }

        .time-display {
            font-size: 5.2rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 4px;
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 25px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: baseline;
            gap: 2px;
        }

        .time-display .colon {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.8em;
            margin: 0 3px;
        }

        /* 搜索区域 */
        .search-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            position: relative;
        }

        .search-box-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 6px;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            box-shadow: 0 6px 28px rgba(0, 0, 0, 0.25);
            transition: background var(--transition), box-shadow var(--transition),
                border-color var(--transition), transform var(--transition);
        }

        .search-box-wrapper:focus-within {
            background: var(--glass-bg);
            border-color: var(--glass-border);
            box-shadow: 0 6px 28px rgba(0, 0, 0, 0.25);
            transform: scale(1);
        }

        /* 搜索引擎图标按钮 */
        .engine-icon-btn {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--text-secondary);
            margin-left: 6px;
            background: transparent;
            border: none;
            cursor: pointer;
            border-radius: 50%;
            transition: background var(--transition), color var(--transition);
            pointer-events: auto;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .engine-icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        /* 下拉菜单：搜索引擎选择（使用 opacity + visibility 实现展开/收起动画） */
        .engine-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 16px;
            min-width: 180px;
            background: rgba(30, 30, 50, 0.85);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
            padding: 6px;
            z-index: 20;
            /* 初始隐藏 + 过渡动画 */
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px) scale(0.96);
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
            pointer-events: none;
            /* 禁止点击，只有当 visible 时才允许 */
        }

        .engine-dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .engine-dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 16px;
            background: transparent;
            border: none;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background 0.2s ease, color 0.2s ease;
            font-family: inherit;
            white-space: nowrap;
            text-align: left;
        }

        .engine-dropdown-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }

        .engine-dropdown-item.active {
            background: var(--accent);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 2px 10px rgba(100, 180, 255, 0.3);
        }

        .engine-dropdown-item .engine-emoji {
            font-size: 1.2rem;
        }

        /* 搜索输入框 */
        .search-input {
            flex: 1;
            min-width: 0;
            height: 44px;
            padding: 0 8px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 1.05rem;
            color: var(--text-primary);
            letter-spacing: 0.5px;
            caret-color: var(--accent);
            transition: color var(--transition);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.75;
            letter-spacing: 0.5px;
        }

        .search-input:focus::placeholder {
            opacity: 0.75;
        }

        .search-btn {
            flex-shrink: 0;
            height: 44px;
            padding: 0 22px;
            margin-right: 6px;
            background: var(--accent);
            border: none;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background var(--transition), transform var(--transition),
                box-shadow var(--transition);
            box-shadow: 0 2px 12px rgba(100, 180, 255, 0.35);
            white-space: nowrap;
            font-family: inherit;
        }

        .search-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 18px rgba(100, 180, 255, 0.5);
        }

        .search-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(100, 180, 255, 0.3);
            transition: all 0.1s ease;
        }

        /* 响应式设计 */
        @media (max-width: 640px) {
            body {
                padding-top: 5vh;
            }
            .container {
                gap: 20px;
                padding: 16px;
                max-width: 100%;
            }

            .time-display {
                font-size: 3.2rem;
                letter-spacing: 2px;
            }

            .search-box-wrapper {
                padding: 5px;
                gap: 8px;
                border-radius: 45px;
            }

            .engine-icon-btn {
                width: 40px;
                height: 40px;
                font-size: 1.3rem;
                margin-left: 4px;
            }

            .search-input {
                height: 40px;
                font-size: 1rem;
                padding: 0 6px;
            }

            .search-btn {
                height: 40px;
                padding: 0 18px;
                font-size: 0.9rem;
                margin-right: 4px;
            }

            .engine-dropdown {
                left: 10px;
                min-width: 160px;
                top: calc(100% + 6px);
            }
        }

        @media (max-width: 400px) {
            .time-display {
                font-size: 2.6rem;
                letter-spacing: 1px;
            }
            .engine-icon-btn {
                width: 34px;
                height: 34px;
                font-size: 1.1rem;
            }
            .search-input {
                height: 34px;
                font-size: 0.9rem;
            }
            .search-btn {
                height: 34px;
                padding: 0 12px;
                font-size: 0.8rem;
            }
            .engine-dropdown-item {
                padding: 8px 12px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="time-section" id="timeSection">
            <div class="time-display" id="timeDisplay">
                <span id="hours">--</span><span class="colon">:</span><span id="minutes">--</span>
            </div>
        </div>

        <div class="search-section">
            <form class="search-box-wrapper" id="searchForm" autocomplete="off">
                <button type="button" class="engine-icon-btn" id="engineIconBtn" aria-label="选择搜索引擎" aria-haspopup="true" aria-expanded="false">
                    <span class="engine-emoji">🔍</span>
                </button>
                <input
                type="text"
                class="search-input"
                id="searchInput"
                placeholder="百度一下，你就知道"
                aria-label="搜索框"
                required
                >
                <button type="submit" class="search-btn" id="searchBtn">搜索</button>
            </form>

            <div class="engine-dropdown" id="engineDropdown" role="menu" aria-labelledby="engineIconBtn">
                <button type="button" class="engine-dropdown-item active" data-engine="baidu" role="menuitem" aria-selected="true">
                    <span class="engine-emoji">🔍</span> 百度
                </button>
                <button type="button" class="engine-dropdown-item" data-engine="bing" role="menuitem" aria-selected="false">
                    <span class="engine-emoji">🔎</span> 必应
                </button>
                <button type="button" class="engine-dropdown-item" data-engine="bilibili" role="menuitem" aria-selected="false">
                    <span class="engine-emoji">📺</span> B站
                </button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ==================== 北京时间 ====================
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');

            const beijingTimeFormatter = new Intl.DateTimeFormat('zh-CN', {
                timeZone: 'Asia/Shanghai',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false,
            });

            function updateBeijingTime() {
                const now = new Date();
                const timeParts = beijingTimeFormatter.formatToParts(now);
                const timeObj = {};
                timeParts.forEach(part => {
                    if (part.type !== 'literal') {
                        timeObj[part.type] = part.value;
                    }
                });

                let hours = timeObj.hour || '--';
                let minutes = timeObj.minute || '--';

                if (hours === '24') {
                    hours = '00';
                }

                hoursEl.textContent = hours.padStart(2, '0');
                minutesEl.textContent = minutes.padStart(2, '0');
            }

            updateBeijingTime();
            setInterval(updateBeijingTime, 10000);

            // ==================== 搜索引擎与下拉菜单 ====================
            const searchForm = document.getElementById('searchForm');
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const engineIconBtn = document.getElementById('engineIconBtn');
            const engineDropdown = document.getElementById('engineDropdown');
            const dropdownItems = document.querySelectorAll('.engine-dropdown-item');
            const engineEmojiSpan = engineIconBtn.querySelector('.engine-emoji');

            const ENGINES = {
                baidu: { name: '百度', placeholder: '百度一下，你就知道', searchUrl: 'https://www.baidu.com/s?wd=', emoji: '🔍' },
                bing: { name: '必应', placeholder: '必应搜索，探索更多', searchUrl: 'https://www.bing.com/search?q=', emoji: '🔎' },
                bilibili: { name: 'B站', placeholder: '搜索B站视频、UP主...', searchUrl: 'https://search.bilibili.com/all?keyword=', emoji: '📺' },
            };

            let currentEngine = 'baidu';

            function updateEngineUI() {
                const engine = ENGINES[currentEngine];
                engineEmojiSpan.textContent = engine.emoji;
                dropdownItems.forEach(item => {
                    const isActive = item.dataset.engine === currentEngine;
                    item.classList.toggle('active', isActive);
                    item.setAttribute('aria-selected', isActive ? 'true' : 'false');
                });
                searchInput.placeholder = engine.placeholder;
                engineIconBtn.setAttribute('aria-label', `当前搜索引擎：${engine.name}，点击切换`);
            }

            function showDropdown() {
                engineDropdown.classList.add('show');
                engineIconBtn.setAttribute('aria-expanded', 'true');
            }

            function hideDropdown() {
                engineDropdown.classList.remove('show');
                engineIconBtn.setAttribute('aria-expanded', 'false');
            }

            function toggleDropdown() {
                if (engineDropdown.classList.contains('show')) {
                    hideDropdown();
                } else {
                    showDropdown();
                }
            }

            engineIconBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleDropdown();
            });

            dropdownItems.forEach(item => {
                item.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const engineKey = this.dataset.engine;
                    if (engineKey && ENGINES[engineKey]) {
                        currentEngine = engineKey;
                        updateEngineUI();
                        hideDropdown();
                        searchInput.focus();
                    }
                });
            });

            document.addEventListener('click', function(e) {
                if (!engineIconBtn.contains(e.target) && !engineDropdown.contains(e.target)) {
                    hideDropdown();
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    hideDropdown();
                }
            });

            updateEngineUI();

            // ==================== 搜索执行 ====================
            function performSearch() {
                const query = searchInput.value.trim();
                if (!query) {
                    searchInput.style.animation = 'shake 0.4s ease';
                    setTimeout(() => {
                        searchInput.style.animation = '';
                    }, 450);
                    searchInput.focus();
                    return;
                }

                const engine = ENGINES[currentEngine];
                const searchUrl = engine.searchUrl + encodeURIComponent(query);
                window.open(searchUrl, '_blank', 'noopener,noreferrer');
            }

            const shakeStyle = document.createElement('style');
            shakeStyle.textContent = `
                @keyframes shake {
                    0%, 100% { transform: translateX(0); }
                    20% { transform: translateX(-6px); }
                    40% { transform: translateX(6px); }
                    60% { transform: translateX(-4px); }
                    80% { transform: translateX(4px); }
                }
                .search-input { animation: none; }
            `;
            document.head.appendChild(shakeStyle);

            searchForm.addEventListener('submit', function(e) {
                e.preventDefault();
                performSearch();
            });

            searchBtn.addEventListener('click', function(e) {
                e.preventDefault();
                performSearch();
            });

            document.addEventListener('keydown', function(e) {
                if (document.activeElement === searchInput) return;
                if (e.key === '/' && !e.ctrlKey && !e.altKey && !e.metaKey) {
                    e.preventDefault();
                    searchInput.focus();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    searchInput.focus();
                }
            });

            if (window.innerWidth > 768) {
                setTimeout(() => {
                    searchInput.focus();
                }, 600);
            }

            const bgImg = new Image();
            bgImg.src = 'image.png';
            bgImg.onerror = function() {
                document.body.style.backgroundImage = 'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)';
                console.warn('背景图 image.png 加载失败，已使用备用渐变背景。');
            };
            bgImg.onload = function() {
                console.log('背景图加载成功。');
            };
        })();
    </script>
</body>
</html>
